<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coffee Round Tracker</title>
<style>body{font-family:system-ui;background:#f6f3ef;color:#241b16;max-width:850px;margin:auto;padding:16px}.card{background:white;border:1px solid #ddd0c3;border-radius:16px;padding:16px;margin:14px 0}button,input{font:inherit;padding:10px;border-radius:10px;margin:4px}button{background:#7b4b2a;color:white;border:0;font-weight:700}input{border:1px solid #ddd0c3}.row{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px dashed #ddd0c3}.danger{background:#b43232}.winner{font-size:1.4rem;background:#fff5e9;padding:12px;border-radius:12px;margin-top:10px}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd0c3}</style></head><body>
<h1>☕ Coffee Round Tracker</h1><p>Local version — no Supabase, no login, no shared database. Data is stored only in this browser.</p>
<div class="card"><h2>People</h2><input id="name" placeholder="Add person"><button onclick="add()">Add Person</button><div id="people"></div></div>
<div class="card"><h2>Today's round</h2><div id="attendance"></div><button onclick="record()">Record Round</button><button onclick="allIn()">Everyone in</button><div id="winner" class="winner hidden"></div></div>
<div class="card"><h2>Leaderboard</h2><div id="board"></div></div>
<div class="card"><h2>History</h2><button class="danger" onclick="reset()">Reset Everything</button><div id="history"></div></div>
<script>
const K="coffeeRoundTrackerLocalOriginal",D={people:["Matt","Kris","Dan"],stats:{Matt:{a:0,b:0},Kris:{a:0,b:0},Dan:{a:0,b:0}},history:[]};let s;try{s=JSON.parse(localStorage.getItem(K))||JSON.parse(JSON.stringify(D))}catch{s=JSON.parse(JSON.stringify(D))}
const $=x=>document.getElementById(x),save=()=>{localStorage.setItem(K,JSON.stringify(s));render()},esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function add(){let n=$("name").value.trim();if(!n||s.people.includes(n))return;s.people.push(n);s.stats[n]={a:0,b:0};$("name").value="";save()}
function remove(n){if(!confirm("Remove "+n+"?"))return;s.people=s.people.filter(x=>x!==n);delete s.stats[n];save()}
function allIn(){document.querySelectorAll(".att").forEach(x=>x.checked=true)}
function selected(){return [...document.querySelectorAll(".att:checked")].map(x=>x.value)}
function buyer(a){return a.map(n=>({n,r:s.stats[n].a?s.stats[n].b/s.stats[n].a:0,b:s.stats[n].b})).sort((x,y)=>x.r-y.r||x.b-y.b||x.n.localeCompare(y.n))[0].n}
function record(){let a=selected();if(!a.length)return alert("Tick who is in first.");let b=buyer(a);a.forEach(n=>s.stats[n].a++);s.stats[b].b++;s.history.push({id:String(Date.now()),date:new Date().toLocaleDateString("en-GB"),a,b});$("winner").textContent="☕ "+b+" is buying this round";$("winner").classList.remove("hidden");save()}
function del(id){let h=s.history.find(x=>x.id===id);if(!h)return;h.a.forEach(n=>{if(s.stats[n])s.stats[n].a=Math.max(0,s.stats[n].a-1)});if(s.stats[h.b])s.stats[h.b].b=Math.max(0,s.stats[h.b].b-1);s.history=s.history.filter(x=>x.id!==id);save()}
function reset(){if(confirm("Reset all coffee data?")){s=JSON.parse(JSON.stringify(D));save()}}
function render(){$("people").innerHTML=s.people.map(n=>`<div class="row"><b>${esc(n)}</b><button class="danger rm" data-n="${esc(n)}">Remove</button></div>`).join("");document.querySelectorAll(".rm").forEach(x=>x.onclick=()=>remove(x.dataset.n));$("attendance").innerHTML=s.people.map(n=>`<div class="row"><label><input class="att" type="checkbox" value="${esc(n)}"> ${esc(n)}</label></div>`).join("");$("board").innerHTML="<table><tr><th>Name</th><th>Bought</th><th>Attended</th></tr>"+s.people.map(n=>`<tr><td>${esc(n)}</td><td>${s.stats[n].b}</td><td>${s.stats[n].a}</td></tr>`).join("")+"</table>";let h=[...s.history].reverse();$("history").innerHTML=h.length?"<table><tr><th>Date</th><th>Present</th><th>Buyer</th><th></th></tr>"+h.map(x=>`<tr><td>${x.date}</td><td>${x.a.map(esc).join(", ")}</td><td>${esc(x.b)}</td><td><button class="danger dl" data-id="${x.id}">Delete</button></td></tr>`).join("")+"</table>":"<p>No rounds yet.</p>";document.querySelectorAll(".dl").forEach(x=>x.onclick=()=>del(x.dataset.id))}
render()</script></body></html>
